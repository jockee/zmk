# Increase Bluetooth transmit power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Queue size for pending behaviors (macros, hold-taps, etc.)
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=64

# Combo tuning removed along with the chord layers; ZMK defaults apply.

# Keyboard HID report is likely enabled by default via USB config

# Enable the macro behavior, as our custom behavior uses its functions
# CONFIG_ZMK_BEHAVIOR_MACRO=y

# Optional: Increase macro wait/tap times if needed, defaults are usually fine
# CONFIG_ZMK_MACRO_WAIT_MS=50
# CONFIG_ZMK_MACRO_TAP_MS=50

# Optional: Enable logging to help debug if things go wrong
# CONFIG_ZMK_LOG_LEVEL_DBG=y
# CONFIG_LOG=y
# CONFIG_USE_SEGGER_RTT=y # Requires RTT setup
# CONFIG_ZMK_USB_LOGGING=y # If logging via USB serial

# CONFIG_ZMK_BEHAVIOR_CYCLE_STRING=y


